<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPNovator | From Ideas to Intelligent Systems</title>

    <meta name="description"
          content="UPNovator — From Ideas to Intelligent Systems">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at center, #ffffff 0%, #f5f6f7 100%);

            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .logo {
            width: min(850px, 100%);
            height: auto;
        }

        .slogan-en {
            margin-top: 30px;
            font-size: 20px;
            letter-spacing: 5px;
            color: #34383d;
        }

        .divider {
            width: 350px;
            max-width: 70%;
            height: 1px;
            margin: 22px auto;
            background: linear-gradient(
                90deg,
                transparent,
                #1269b0,
                #9b102c,
                transparent
            );
        }

        .slogan-ru {
            font-size: 15px;
            letter-spacing: 3px;
            color: #686d72;
        }

        .coming {
            margin-top: 55px;
            font-size: 11px;
            letter-spacing: 6px;
            color: #999;
            text-transform: uppercase;
        }

        @media (max-width: 650px) {

            .slogan-en {
                font-size: 14px;
                letter-spacing: 2px;
            }

            .slogan-ru {
                font-size: 12px;
                letter-spacing: 1px;
            }

        }

    </style>
</head>

<body>

    <main class="container">

        <img
            src="assets/upnovator-logo.png"
            alt="UPNovator"
            class="logo"
        >

        <div class="slogan-en">
            From Ideas to Intelligent Systems
        </div>

        <div class="divider"></div>

        <div class="slogan-ru">
            От идей к интеллектуальным системам
        </div>

        <div class="coming">
            Coming Soon
        </div>

    </main>

</body>

</html>
